services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./database.mongodb.json:/seed/database.mongodb.json:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DATABASE=appgym
      - MONGODB_USERS_COLLECTION=usuarios
