name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  PHP_VERSION: "8.2"
  NODE_VERSION: "20"
  IMAGE_NAME: appgym-app

jobs:
  ci:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Lint PHP files
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        run: composer test:unit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start test environment
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Seed test users
        run: docker compose -f docker-compose.test.yml exec -T mongo mongoimport --db appgym --collection usuarios --drop --file /seed/database.mongodb.json --jsonArray

      - name: Run integration tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: appgym_test
          MONGODB_USERS_COLLECTION: usuarios_integracion
        run: composer test:integration

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.test.yml logs
          exit 1

      - name: Run authentication test cases
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
